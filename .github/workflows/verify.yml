name: Verify source and Windows package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-tests:
    name: Python data and provenance tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run tests without Qt or model dependencies
        run: python scripts/build_evidence.py test --output verification/linux-data/unit-tests.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-data-evidence
          path: verification/linux-data/
          if-no-files-found: warn
          retention-days: 14

  linux-ui:
    name: Linux Qt offscreen workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Install the exact build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run the application workflow
        run: |
          python scripts/build_evidence.py check-dependencies
          python scripts/build_evidence.py test --module test_ui --output verification/linux-qt/unit-tests.json
          python app.py --smoke-test verification/linux-qt
          python scripts/build_evidence.py verify-smoke verification/linux-qt/smoke-result.json --packaged no
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-qt-evidence
          path: verification/linux-qt/
          if-no-files-found: warn
          retention-days: 14

  windows-package:
    name: Windows x64 build, install and uninstall
    needs: [data-tests, linux-ui]
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install the exact build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build with source and frozen executable verification
        run: ./build.ps1 -Python (Get-Command python.exe).Source
      - name: Verify installed program and uninstall
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the version.' }
          $installer = "dist/AperAI-VirtualCell-Workbench-Setup-$version-x64.exe"
          ./scripts/verify_install.ps1 -Installer $installer -Python (Get-Command python.exe).Source
          if ($LASTEXITCODE -ne 0) { throw 'Installation verification failed.' }
          python scripts/build_evidence.py release --snapshot verification/windows-build/build-inputs.json --artifact $installer --output "$installer.build.json" --evidence verification/windows-build/unit-tests.json --evidence verification/windows-build/source-smoke/smoke-result.json --evidence verification/windows-build/frozen-smoke/smoke-result.json --evidence verification/windows-install/installed-smoke/smoke-result.json --evidence verification/windows-install/install-result.json
          if ($LASTEXITCODE -ne 0) { throw 'Final package evidence could not be recorded.' }
      # Artifacts support review. This workflow has no release or publishing step.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-verification-evidence
          path: verification/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: windows-verified-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14
