name: Verify AIVC skill

on:
  pull_request:
    paths: ['aivc-skill/**', '.github/workflows/skill.yml']
  push:
    branches: [main]
    paths: ['aivc-skill/**', '.github/workflows/skill.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-tests:
    name: Skill tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: aivc-skill
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aivc-skill/requirements-tests.txt
      - name: Install fast-test dependencies
        run: python -m pip install -r requirements-tests.txt
      - name: Run contract and preflight tests
        run: python -m unittest discover -s tests -v
      - name: Verify lightweight command entry points
        run: |
          python scripts/preflight.py --help
          python examples/ko_oe/celloracle_run.py --help
          python examples/ko_oe/geneformer_route.py --help
      - name: Build and verify the source-only skill package
        run: python scripts/package_skill.py
      - uses: actions/upload-artifact@v7
        with:
          name: aivc-skill-${{ matrix.os }}
          path: aivc-skill/dist/aivc.zip
          if-no-files-found: error
          retention-days: 14
